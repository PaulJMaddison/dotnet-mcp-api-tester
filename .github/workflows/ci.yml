name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'interview/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DotnetMcpApiTester.sln
      - name: Build
        run: dotnet build DotnetMcpApiTester.sln -c Release --no-restore
      - name: Test
        run: dotnet test DotnetMcpApiTester.sln -c Release --no-build --logger trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
